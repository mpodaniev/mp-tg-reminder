name: Wake scheduler (backup)

# Pings POST /wake so the bot fires due reminders and expires stale prompts.
# The app has no in-process timer (webhook-cron-wake ADR-0001), so an
# external cadence is what actually drives time-based delivery.
#
# GitHub Actions' `schedule` trigger is NOT the primary scheduler: GitHub
# explicitly documents that scheduled workflow runs can be delayed or
# dropped under load, and low-activity/private repos are throttled hardest —
# in practice this repo saw gaps of 1-3+ hours instead of the configured
# 5 minutes. The primary trigger is an external cron service (e.g.
# cron-job.org) calling /wake every 3 minutes, matching WAKE_INTERVAL_MS
# (see docs/features/webhook-cron-wake/README.md). This workflow is kept
# only as a low-frequency safety net in case that external service has an
# outage — duplicate /wake calls are harmless (single-flight tick, AC-06).

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /wake
        run: |
          curl -fsS -X POST https://mp-tg-reminder.fly.dev/wake \
            -H "Authorization: Bearer ${{ secrets.WAKE_BEARER_TOKEN }}" \
            --max-time 90
