app = "mp-tg-reminder"
primary_region = "ams"

[build]

[env]
  DB_PATH = "/data/reminders.db"
  PORT = "3000"

[[mounts]]
  source = "reminders_data"
  destination = "/data"

# ADR-0001: the internal setInterval timer is gone — reminder checks now run
# only when the external wake scheduler calls POST /wake. This block lets
# Fly.io track inbound HTTP (webhook + wake calls) so the machine can stop
# fully between them and start back up on the next request.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  # Liveness check against the unauthenticated GET /health route. A boot that
  # crash-loops (e.g. a missing required secret exits the process) never opens
  # port 3000, so this check never passes and `fly deploy` fails loudly instead
  # of reporting a green non-serving release. Fly does not run checks against a
  # stopped machine, so this does not defeat scale-to-zero; grace_period covers
  # a healthy cold start.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
